name: Build and Release APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Setup local.properties
        run: |
          echo "keystore.path=../release-key.jks" >> local.properties
          echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "keystore.alias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "key.password=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Build Signed APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease

      - name: Generate version.json
        run: |
          mkdir public_json
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk"
          echo "{\"latest_version\": ${{ github.run_number }}, \"url\": \"$APK_URL\"}" > public_json/version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Deploy version.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_json
          publish_branch: gh-pages
